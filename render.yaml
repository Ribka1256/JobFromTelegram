# render.yaml
# Defines the two Render services for JobFeed v2.
# The scheduler is handled by GitHub Actions (free) — no Render worker needed.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── 1. Express API (Web Service) ──────────────────────────────────────────
  - type: web
    name: jobfeed-api
    runtime: node
    buildCommand: cd JobFromTG/server && npm install
    startCommand: cd JobFromTG/server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ── 2. React Frontend (Static Site) ───────────────────────────────────────
  - type: web
    name: jobfeed-ui
    runtime: static
    buildCommand: cd JobFromTG && npm install && npm run build
    staticPublishPath: JobFromTG/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
