# render.yaml
# Defines all three Render services for JobFeed v2.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── 1. Express API (Web Service) ──────────────────────────────────────────
  # Serves the HTTP API that the React frontend talks to.
  # Must be running at all times for the app to work.
  - type: web
    name: jobfeed-api
    runtime: node
    buildCommand: cd JobFromTG/server && npm install
    startCommand: cd JobFromTG/server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false

  # ── 2. Telegram Scraper + Importer (Background Worker) ────────────────────
  # Runs scheduler.py which calls telegram_scraper.py then import_jobs.mjs
  # every 30 minutes. This is what keeps job data fresh.
  # Uses the "worker" type — no HTTP port needed.
  - type: worker
    name: jobfeed-scheduler
    runtime: python
    buildCommand: >
      cd JobFromTG/server &&
      pip install -r requirements.txt &&
      npm install
    startCommand: cd JobFromTG/server && python scheduler.py
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_PHONE
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JOBFEED_SCRAPE_INTERVAL_MINUTES
        value: "30"

  # ── 3. React Frontend (Static Site) ───────────────────────────────────────
  # Compiled to static files. Render serves them on a CDN.
  - type: web
    name: jobfeed-ui
    runtime: static
    buildCommand: cd JobFromTG && npm install && npm run build
    staticPublishPath: JobFromTG/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
